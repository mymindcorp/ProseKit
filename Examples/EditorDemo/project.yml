name: EditorDemo
options:
  bundleIdPrefix: ai.processor
  deploymentTarget:
    iOS: "16.0"
packages:
  EditorSwift:
    path: ../..
targets:
  EditorDemo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    dependencies:
      - package: EditorSwift
        product: EditorUIKit
      - package: EditorSwift
        product: SchemaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.processor.EditorDemo
        SUPPORTS_MACCATALYST: "YES"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SWIFT_VERSION: "6.0"
