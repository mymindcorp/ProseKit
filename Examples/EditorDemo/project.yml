name: EditorDemo
options:
  bundleIdPrefix: ai.processor
  deploymentTarget:
    iOS: "18.0"
packages:
  ProseKit:
    path: ../..
targets:
  EditorDemo:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
      # `icon.swift` is a standalone AppKit script that renders the app icon
      # PNG — it is top-level code, and compiling it into the app fails the
      # build the moment the project is regenerated.
      - path: Resources
        excludes:
          - icon.swift
    dependencies:
      - package: ProseKit
        product: EditorUIKit
      - package: ProseKit
        product: SchemaKit
      - package: ProseKit
        product: EditorSerialization
      - package: ProseKit
        product: EditorSyntax
      - package: ProseKit
        product: EditorMath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.processor.EditorDemo
        SUPPORTS_MACCATALYST: "YES"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SWIFT_VERSION: "6.0"
